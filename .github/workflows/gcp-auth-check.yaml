name: GCP Auth Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write

jobs:
  gcp-auth-check:
    runs-on: ubuntu-latest
    # Skipped on repository copies: the Docker Hub / GCP credentials live in the
    # upstream team repository, so a copy has nothing to authenticate with.
    if: github.repository == 'apate476/toxic-comment-classifier'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify GCP authentication
        run: |
          gcloud auth list
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"

      - name: Verify Artifact Registry access
        run: |
          gcloud artifacts repositories list \
            --location="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Verify Cloud Run access
        run: |
          gcloud run services describe toxic-comment-api \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"
